services:
  jupyterlab:
    build: .
    ports:
      - "127.0.0.1:8780:8780"
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-waterec-local}
    volumes:
      - .:/workspace
    working_dir: /workspace/notebooks
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  annotator:
    build: ./annotator
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./annotator/static/images:/images
